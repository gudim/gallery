name: Release Trips Server

# Trips layer (this fork): builds the server image (server + web) and
# pushes it to this fork's GHCR, ghcr.io/<owner>/gallery-server. The home
# server only pulls it; the ML image stays stock Gallery's
# (specs/trips/PLAN.md, D4).
#
# Derived from gallery-release-server-only.yml, which stays untouched. Only
# the server build and manifest merge are kept: no ML images, no git tags,
# no GitHub Release, no version endpoint publish.
#
# Versioning: the image tag is the Gallery release tag trips-all is rebased
# onto plus a fourth number, our build (v5.10.0.1, v5.10.0.2, ... and v5.11.0.1
# after the next rebase). The app itself is stamped with the three-part base:
# the server parses its version with SemVer and would not boot on four parts.
# The full tag still reaches the server as IMMICH_SOURCE_REF.
#
# The trips Android app (TRIPS_BUILD, arm64 only) is built and signed here too
# and shipped inside the image as static web files under /trips-app/: the APK
# and gallery-trips.json, which the web's account menu and the app's update
# check read. Signing needs the repository secrets TRIPS_ANDROID_KEY_JKS (the
# keystore, base64), TRIPS_ANDROID_KEY_ALIAS, TRIPS_ANDROID_KEY_PASSWORD and
# TRIPS_ANDROID_STORE_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag: the Gallery base tag plus our build number (e.g. v5.10.0.1)'
        required: true
        type: string
      commit:
        description: 'Commit SHA to build (default: HEAD of the triggering branch). Must be an ancestor of it.'
        required: false
        type: string

concurrency:
  group: trips-release-server
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Resolve version & commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      base: ${{ steps.version.outputs.base }}
      sha: ${{ steps.version.outputs.sha }}
      image: ${{ steps.version.outputs.image }}
      apk_code: ${{ steps.version.outputs.apk_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
          DEFAULT_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ ! "$INPUT_VERSION" =~ ^(v([0-9]+)\.([0-9]+)\.([0-9]+))\.([1-9][0-9]?)$ ]]; then
            echo "::error::Invalid version: '$INPUT_VERSION' (expected <Gallery tag>.<build>, build 1-99, e.g. v5.10.0.1)"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          # The APK's version code (trips DECISIONS-LOG 2026-11-08): v5.10.0.1 -> 5100001.
          apk_code=$(( BASH_REMATCH[2] * 1000000 + BASH_REMATCH[3] * 10000 + BASH_REMATCH[4] * 100 + BASH_REMATCH[5] ))

          sha="$DEFAULT_SHA"
          if [[ -n "$INPUT_COMMIT" ]]; then
            # Only build a commit already on the triggering branch.
            if ! sha=$(git rev-parse --verify --quiet "${INPUT_COMMIT}^{commit}"); then
              echo "::error::commit '$INPUT_COMMIT' not found in history"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" "$DEFAULT_SHA"; then
              echo "::error::commit '$sha' is not an ancestor of ${DEFAULT_SHA}; refusing to build a commit not merged on this branch"
              exit 1
            fi
          fi

          # The base must be the Gallery release the build sits on: its tag is
          # an ancestor of the commit, and no newer Gallery tag is.
          git fetch --quiet --no-tags https://github.com/open-noodle/gallery.git '+refs/tags/v*:refs/gallery-tags/v*'
          if ! git rev-parse --verify --quiet "refs/gallery-tags/${base}^{commit}" >/dev/null; then
            echo "::error::Gallery has no tag ${base}"
            exit 1
          fi
          newest=$(git for-each-ref --merged "$sha" --format='%(refname:lstrip=2)' 'refs/gallery-tags/v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [[ "$newest" != "$base" ]]; then
            echo "::error::${sha} is built on Gallery '${newest}', not ${base}; use ${newest}.<build>"
            exit 1
          fi

          # GHCR image names must be lowercase.
          image="ghcr.io/${OWNER,,}/gallery-server"

          major=$(echo "$INPUT_VERSION" | sed 's/^v//' | cut -d. -f1)
          {
            echo "version=$INPUT_VERSION"
            echo "major=v${major}"
            echo "base=$base"
            echo "sha=$sha"
            echo "image=$image"
            echo "apk_code=$apk_code"
          } >> "$GITHUB_OUTPUT"
          echo "Building $image:$INPUT_VERSION from $sha (Gallery $base)"

  build-apk:
    name: Build trips APK
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Apply branding
        uses: ./.github/actions/apply-branding
        with:
          version: ${{ needs.version.outputs.base }}
          build_number: ${{ needs.version.outputs.apk_code }}

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Create the keystore
        env:
          KEY_JKS: ${{ secrets.TRIPS_ANDROID_KEY_JKS }}
        working-directory: ./mobile
        run: |
          if [[ -z "$KEY_JKS" ]]; then
            echo "::error::secret TRIPS_ANDROID_KEY_JKS is not set; an APK signed with a throwaway key would not install over the last one"
            exit 1
          fi
          printf '%s' "$KEY_JKS" | base64 -d > android/key.jks

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version-file: ./mobile/pubspec.yaml
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''

      - name: Get packages
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build signed APK
        working-directory: ./mobile
        env:
          TRIPS_BUILD: '1'
          ALIAS: ${{ secrets.TRIPS_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TRIPS_ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.TRIPS_ANDROID_STORE_PASSWORD }}
          BASE: ${{ needs.version.outputs.base }}
          CODE: ${{ needs.version.outputs.apk_code }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${BASE#v}" --build-number="$CODE"

      - name: Lay out /trips-app
        working-directory: ./mobile
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.apk_code }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if ! unzip -Z1 "$apk" | grep -qx 'lib/arm64-v8a/libsqlite3.so'; then
            echo "::error::libsqlite3.so missing from the APK"
            exit 1
          fi
          out="$RUNNER_TEMP/trips-app"
          mkdir -p "$out"
          file="gallery-trips-${VERSION}.apk"
          cp "$apk" "$out/$file"
          jq -n --arg version "$VERSION" --argjson versionCode "$CODE" --arg file "$file" \
            --argjson size "$(stat -c %s "$out/$file")" \
            '{version: $version, versionCode: $versionCode, file: $file, size: $size}' > "$out/gallery-trips.json"
          cat "$out/gallery-trips.json"

      - name: Upload APK
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: trips-app
          path: ${{ runner.temp }}/trips-app/*
          if-no-files-found: error

  build-server:
    name: Build Server (${{ matrix.platform }})
    needs: [version, build-apk]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must run before the Docker build: it rewrites upstream Immich
      # references in the source tree the build copies.
      - name: Apply branding
        uses: ./.github/actions/apply-branding
        with:
          version: ${{ needs.version.outputs.base }}

      # After branding, which rewrites text files in the tree. The web build
      # copies web/static into /build/www, which the server serves as is.
      - name: Download APK into the web's static files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trips-app
          path: web/static/trips-app

      - name: Prepare platform pair
        id: prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "platform-pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_REF=${{ needs.version.outputs.version }}
            BUILD_SOURCE_COMMIT=${{ needs.version.outputs.sha }}
          outputs: type=image,"name=${{ needs.version.outputs.image }}",push-by-digest=true,name-resolution=short,push=true
          cache-from: type=gha,scope=trips-server-${{ steps.prepare.outputs.platform-pair }}
          cache-to: type=gha,scope=trips-server-${{ steps.prepare.outputs.platform-pair }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: server-digests-${{ steps.prepare.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-server:
    name: Merge Server Manifest
    needs: [version, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Login to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}
          MAJOR: ${{ needs.version.outputs.major }}
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:${MAJOR}" -t "${IMAGE}:release" \
            "${sources[@]}"
          echo "Pushed ${IMAGE}:${VERSION}, :${MAJOR}, :release" >> "$GITHUB_STEP_SUMMARY"
